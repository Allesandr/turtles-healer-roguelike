<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Черепахи и целитель — авто-рогалик</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b10;color:#d8d8e2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:12px;padding:12px;justify-content:center;align-items:flex-start}
.stage{flex:1 1 640px;max-width:960px;min-width:300px}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid #2a2a36;background:#000}
.cvwrap{position:relative}
.startbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;padding:12px 28px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(#3aa85c,#237a40);border:2px solid #7be39a;border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(80,220,120,.45);animation:pulse 1.6s ease-in-out infinite}
.startbtn:hover{filter:brightness(1.12)}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(80,220,120,.85)}}
.wide .stage{flex:1 1 100%;max-width:none}
.wide .side{flex:1 1 100%}
.wide #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px}
.wide #cards .card{margin-bottom:0}
.bar-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.bar-top button{background:#1a1a24;color:#ccd;border:1px solid #33344a;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}
.bar-top button:hover{background:#242436}
.bar-top button.on{background:#3a3a66;border-color:#7a7aff;color:#fff}
#meta{margin-left:auto;font-size:12px;color:#8a8aa0}
.side{flex:0 0 350px;max-width:100%}
.card{display:grid;grid-template-columns:54px 1fr;gap:9px;padding:7px;border:1px solid #2a2a36;border-radius:9px;margin-bottom:6px;background:#14141c}
.card.dead{opacity:.45;filter:grayscale(.8)}
.av{width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #888;align-self:start}
.top{display:flex;gap:6px;align-items:baseline;font-size:13px;margin-bottom:3px}
.top .lv{color:#9a9ab0;font-size:11px}
.top .tag{margin-left:auto;font-size:10px;color:#ffb347}
.bar{position:relative;height:11px;background:#23232e;border-radius:4px;overflow:hidden;margin-bottom:2px}
.bar i{display:block;height:100%;width:0;transition:width .12s linear}
.bar em{position:absolute;left:5px;top:-1px;font-style:normal;font-size:9px;line-height:12px;color:#fff;text-shadow:0 0 3px #000}
.bar.hp i{background:#2fa84f}.bar.en i{background:#d9a21b}.bar.mana i{background:#3b86d6}.bar.rage i{background:#d6402f}
.bar.xp{height:4px;margin-top:3px}.bar.xp i{background:#9a7be0}
.stats{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:10px;color:#8a8aa0;margin-top:3px}
.stats b{color:#cfd0e0}
.gear{display:flex;gap:4px;margin-top:4px}
.gear i{width:18px;height:18px;border:2px solid #333;border-radius:4px;font-size:9px;font-style:normal;text-align:center;line-height:14px;color:#aaa;cursor:help}
#log{height:210px;overflow-y:auto;background:#10101a;border:1px solid #2a2a36;border-radius:9px;padding:6px 8px;font-size:12px;line-height:1.45}
.l{color:#aab}.l.sys{color:#7a8aa8}.l.bad{color:#ff7b7b}.l.lvl{color:#ffe27a}.l.loot{color:#b891ff}.l.boss{color:#ff5a6e;font-weight:600}.l.coin{color:#7ff3ff}.l.rage{color:#ff8a5a}
.pas{font-size:10px;color:#ffb347;margin-top:3px;min-height:0}
h1{font-size:13px;margin:0 0 8px;color:#8a8aa0;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#augpick{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,4,10,.72);border-radius:10px;z-index:5;padding:12px;overflow:auto}
#augpick .ttl{font-size:22px;font-weight:700;color:#ffe27a;text-shadow:0 0 14px rgba(255,226,122,.4)}
#augpick .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#augpick .augcard{width:270px;margin:0}
#augpick .augcard .ds{font-size:12.5px}
.augcol{flex:0 0 250px;max-width:100%}
.wide .augcol{flex:1 1 100%}
.augcard{border:1px solid #33344a;border-radius:10px;padding:10px;margin-bottom:8px;background:linear-gradient(160deg,#171726,#101019);position:relative}
.augcard .ic{font-size:26px;line-height:1}
.augcard .nm{font-weight:700;font-size:14px;color:#e8e8f4;margin:4px 0 4px}
.augcard .ds{font-size:11.5px;line-height:1.4;color:#9a9ab4}
.augcard .st{margin-top:8px;font-size:11px;color:#7be39a;min-height:14px}
.augcard.pick{cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.augcard{border-width:2px}
.augcard.r-rare{border-color:#4a8cff;--rc:74,140,255}
.augcard.r-uncommon{border-color:#3fbf72;--rc:63,191,114}
.augcard.r-epic{border-color:#a65bff;--rc:166,91,255}
.augcard.pick:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(var(--rc),.45)}
.augcard.on{box-shadow:0 0 12px rgba(var(--rc),.28)}
.augcard.on .badge{position:absolute;right:8px;top:8px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#7be39a;border:1px solid #3a7a52;border-radius:4px;padding:1px 5px}
.augnote{font-size:11.5px;color:#8a8aa0;line-height:1.45;padding:4px 2px}
.augnote.hot{color:#ffe27a;animation:augpulse 1.4s infinite}
@keyframes augpulse{50%{opacity:.55}}
.stats-bar{margin-top:6px}
.stats-bar-inner{background:#10101a;border:1px solid #2a2a36;border-radius:8px;padding:5px 8px;overflow-x:auto}
.stats-bar table{width:100%;border-collapse:collapse;font-size:10px;min-width:520px}
.stats-bar th,.stats-bar td{padding:2px 5px;text-align:right;white-space:nowrap}
.stats-bar th:first-child,.stats-bar td:first-child{text-align:left}
.stats-bar th{color:#6a6a80;font-weight:600;font-size:9px;text-transform:uppercase;border-bottom:1px solid #222230}
.stats-bar td{color:#c8c8d4;border-bottom:1px solid #1a1a24}
.stats-bar td.name{font-weight:600}
.stats-bar tr.tot td{border-top:1px solid #33344a;border-bottom:none;font-weight:600;color:#ffe27a}
.stats-bar .prev-row{margin-top:4px;padding-top:4px;border-top:1px dashed #2a2a36;font-size:10px;color:#7a8aa8;line-height:1.35}
.stats-bar .prev-row b{color:#aab}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="cvwrap"><canvas id="cv"></canvas><button id="startrun" class="startbtn">▶ Начать забег</button><div id="augpick"></div></div>
    <div class="bar-top">
      <button id="pause">⏸ Пауза</button>
      <button data-sp="1" class="on">×1</button><button data-sp="2">×2</button><button data-sp="4">×4</button><button data-sp="8">×8</button><button data-sp="16">×16</button>
      <button id="wide">⤢ Расширить</button>
      <button id="newrun">⟲ Новый забег</button>
      <span id="meta"></span>
    </div>
    <div class="stats-bar">
      <div class="stats-bar-inner">
        <div id="statsLive"></div>
        <div id="statsPrev" class="prev-row" style="display:none"></div>
      </div>
    </div>
  </div>
  <div class="side">
    <h1>Отряд</h1>
    <div id="cards"></div>
    <h1 style="margin-top:10px">Журнал</h1>
    <div id="log"></div>
  </div>
  <div class="augcol">
    <h1>Аугментации</h1>
    <div id="augs"></div>
  </div>
</div>

</html>
