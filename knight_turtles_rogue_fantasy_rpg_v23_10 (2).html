<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Черепахи и целитель — авто-рогалик</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b10;color:#d8d8e2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:12px;padding:12px;justify-content:center;align-items:flex-start}
.stage{flex:1 1 640px;max-width:960px;min-width:300px}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid #2a2a36;background:#000}
.cvwrap{position:relative}
.startbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;padding:12px 28px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(#3aa85c,#237a40);border:2px solid #7be39a;border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(80,220,120,.45);animation:pulse 1.6s ease-in-out infinite}
.startbtn:hover{filter:brightness(1.12)}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(80,220,120,.85)}}
.wide .stage{flex:1 1 100%;max-width:none}
.wide .side{flex:1 1 100%}
.wide #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px}
.wide #cards .card{margin-bottom:0}
.bar-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.bar-top button{background:#1a1a24;color:#ccd;border:1px solid #33344a;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}
.bar-top button:hover{background:#242436}
.bar-top button.on{background:#3a3a66;border-color:#7a7aff;color:#fff}
#meta{margin-left:auto;font-size:12px;color:#8a8aa0}
.side{flex:0 0 350px;max-width:100%}
.card{display:grid;grid-template-columns:54px 1fr;gap:9px;padding:7px;border:1px solid #2a2a36;border-radius:9px;margin-bottom:6px;background:#14141c}
.card.dead{opacity:.45;filter:grayscale(.8)}
.av{width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #888;align-self:start}
.top{display:flex;gap:6px;align-items:baseline;font-size:13px;margin-bottom:3px}
.top .lv{color:#9a9ab0;font-size:11px}
.top .tag{margin-left:auto;font-size:10px;color:#ffb347}
.bar{position:relative;height:11px;background:#23232e;border-radius:4px;overflow:hidden;margin-bottom:2px}
.bar i{display:block;height:100%;width:0;transition:width .12s linear}
.bar em{position:absolute;left:5px;top:-1px;font-style:normal;font-size:9px;line-height:12px;color:#fff;text-shadow:0 0 3px #000}
.bar.hp i{background:#2fa84f}.bar.en i{background:#d9a21b}.bar.mana i{background:#3b86d6}.bar.rage i{background:#d6402f}
.bar.xp{height:4px;margin-top:3px}.bar.xp i{background:#9a7be0}
.stats{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:10px;color:#8a8aa0;margin-top:3px}
.stats b{color:#cfd0e0}
.gear{display:flex;gap:4px;margin-top:4px}
.gear i{width:18px;height:18px;border:2px solid #333;border-radius:4px;font-size:9px;font-style:normal;text-align:center;line-height:14px;color:#aaa;cursor:help}
#log{height:210px;overflow-y:auto;background:#10101a;border:1px solid #2a2a36;border-radius:9px;padding:6px 8px;font-size:12px;line-height:1.45}
.l{color:#aab}.l.sys{color:#7a8aa8}.l.bad{color:#ff7b7b}.l.lvl{color:#ffe27a}.l.loot{color:#b891ff}.l.boss{color:#ff5a6e;font-weight:600}.l.coin{color:#7ff3ff}.l.rage{color:#ff8a5a}
.pas{font-size:10px;color:#ffb347;margin-top:3px;min-height:0}
h1{font-size:13px;margin:0 0 8px;color:#8a8aa0;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#augpick{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,4,10,.72);border-radius:10px;z-index:5;padding:12px;overflow:auto}
#augpick .ttl{font-size:22px;font-weight:700;color:#ffe27a;text-shadow:0 0 14px rgba(255,226,122,.4)}
#augpick .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#augpick .augcard{width:270px;margin:0}
#augpick .augcard .ds{font-size:12.5px}
.augcol{flex:0 0 250px;max-width:100%}
.wide .augcol{flex:1 1 100%}
.augcard{border:1px solid #33344a;border-radius:10px;padding:10px;margin-bottom:8px;background:linear-gradient(160deg,#171726,#101019);position:relative}
.augcard .ic{font-size:26px;line-height:1;display:flex;align-items:center;justify-content:flex-start;min-height:28px}
.augcard .nm{font-weight:700;font-size:14px;color:#e8e8f4;margin:4px 0 4px}
.augcard .ds{font-size:11.5px;line-height:1.4;color:#9a9ab4}
.augcard .st{margin-top:8px;font-size:11px;color:#7be39a;min-height:14px}
.augcard.pick{cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.augcard{border-width:2px}
.augcard.r-rare{border-color:#4a8cff;--rc:74,140,255}
.augcard.r-uncommon{border-color:#3fbf72;--rc:63,191,114}
.augcard.r-epic{border-color:#a65bff;--rc:166,91,255}
.augcard.pick:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(var(--rc),.45)}
.augcard.on{box-shadow:0 0 12px rgba(var(--rc),.28)}
.augcard.on .badge{position:absolute;right:8px;top:8px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#7be39a;border:1px solid #3a7a52;border-radius:4px;padding:1px 5px}
.augnote{font-size:11.5px;color:#8a8aa0;line-height:1.45;padding:4px 2px}
.augnote.hot{color:#ffe27a;animation:augpulse 1.4s infinite}
@keyframes augpulse{50%{opacity:.55}}
.stats-bar{margin-top:6px}
.stats-bar-inner{background:#10101a;border:1px solid #2a2a36;border-radius:8px;padding:5px 8px;overflow-x:auto}
.stats-bar table{width:100%;border-collapse:collapse;font-size:10px;min-width:520px}
.stats-bar th,.stats-bar td{padding:2px 5px;text-align:right;white-space:nowrap}
.stats-bar th:first-child,.stats-bar td:first-child{text-align:left}
.stats-bar th{color:#6a6a80;font-weight:600;font-size:9px;text-transform:uppercase;border-bottom:1px solid #222230}
.stats-bar td{color:#c8c8d4;border-bottom:1px solid #1a1a24}
.stats-bar td.name{font-weight:600}
.stats-bar tr.tot td{border-top:1px solid #33344a;border-bottom:none;font-weight:600;color:#ffe27a}
.stats-bar .prev-row{margin-top:4px;padding-top:4px;border-top:1px dashed #2a2a36;font-size:10px;color:#7a8aa8;line-height:1.35}
.stats-bar .prev-row b{color:#aab}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="cvwrap"><canvas id="cv"></canvas><button id="startrun" class="startbtn">▶ Начать забег</button><div id="augpick"></div></div>
    <div class="bar-top">
      <button id="pause">⏸ Пауза</button>
      <button data-sp="1" class="on">×1</button><button data-sp="2">×2</button><button data-sp="4">×4</button><button data-sp="8">×8</button><button data-sp="16">×16</button>
      <button id="wide">⤢ Расширить</button>
      <button id="newrun">⟲ Новый забег</button>
      <button id="lang" title="Language / Язык">🌐 EN</button>
      <span id="meta"></span>
    </div>
    <div class="stats-bar">
      <div class="stats-bar-inner">
        <div id="statsLive"></div>
        <div id="statsPrev" class="prev-row" style="display:none"></div>
      </div>
    </div>
  </div>
  <div class="side">
    <h1>Отряд</h1>
    <div id="cards"></div>
    <h1 style="margin-top:10px">Журнал</h1>
    <div id="log"></div>
  </div>
  <div class="augcol">
    <h1>Аугментации</h1>
    <div id="augs"></div>
  </div>
</div>

  let ex = 0, ey = 0; G.enemies.forEach(e => { ex += e.x; ey += e.y; }); ex /= G.enemies.length; ey /= G.enemies.length;

function tickHero(h, dt) {

  h.cd -= dt; h.gcd -= dt; h.skCd -= dt; h.tauntCd -= dt; h.barrierCd -= dt; h.blessCd -= dt;

  if (h.slowT > 0) h.slowT -= dt;
  if (h.invulnT > 0) h.invulnT -= dt;

      for (const a of G.heroes) {

        const tickHeal = a.maxHp * BAL.sancPct + (h.S.healAmt || 0) * BAL.sancHealK; const real = Math.min(tickHeal, a.maxHp - a.hp);

function separate() {
  const U = G.heroes.filter(h => h.alive).concat(G.enemies);
  for (let i = 0; i < U.length; i++) for (let j = i + 1; j < U.length; j++) {
    const a = U[i], b = U[j]; const min = a.r + b.r - 3; let dx = b.x - a.x, dy = b.y - a.y; let d = Math.hypot(dx, dy);
    if (d < min) {
      if (d < .01) { dx = rnd(-1, 1); dy = rnd(-1, 1); d = Math.hypot(dx, dy) || 1; }
      const push = (min - d); const ma = (a.boss || (a.d && a.d.static)) ? 0.1 : a.r, mb = (b.boss || (b.d && b.d.static)) ? 0.1 : b.r; const tot = ma + mb; const fa = mb / tot, fb = ma / tot;
      a.x -= dx / d * push * fa; a.y -= dy / d * push * fa; b.x += dx / d * push * fb; b.y += dy / d * push * fb;
    }
  }
  for (const u of U) pushOut(u);
}

function update(dt) {

  if (G.phase === 'combat') G.fightT += dt;

  pickCoins(dt);

    G.timer -= dt; if (G.timer <= 0) { if (G.room.type === 'altar') { startAltar(); } else if (G.room.type === 'rest') { startRest(); } else if (G.enemies.length) { G.phase = 'combat'; cowaStart(); mikePull(); } else startClear(); }
  } else if (ph === 'prep') {
    updPrep(dt);
  } else if (ph === 'combat') {
    if (cowaUpdate(dt)) { updFx(dt); return; }
    G.combatT += dt;
    applyTurretAura();
    for (const e of G.enemies.slice()) updEnemy(e, dt);
    updGraveyard(dt);
    squadThink(dt);
    tickBleed(dt);
    for (const h of G.heroes) if (h.alive) { if (h.stun > 0) continue; updHeroCombat(h, dt); }
    updTele(dt); updProj(dt); separate(); usePotions();
    if (!aliveHeroes().length) return gameOver();
    if (!G.enemies.length) startClear();
  } else if (ph === 'clear') {
    G.clearT += dt; const al = G.alle;
    if (al.alive) castLogic(al, false);
    for (const h of aliveHeroes()) { if (h.isBuddy || h === al) continue; }
    const low = aliveHeroes().reduce((m, a) => Math.min(m, a.hp / a.maxHp), 1);
    if (G.clearT > 1.0 && (low > 0.88 || !al.alive || al.res < 18) || G.clearT > 9) leaveClear();
  } else if (ph === 'coins') {

    else aliveHeroes().forEach((h, i) => walkTo(h, c.x + (i - 2) * 6, c.y + (i % 2) * 10, dt));
  } else if (ph === 'altar') {

      al.forEach((h, i) => { const sp = altarSpot(i, al.length); if (Math.hypot(sp.x - h.x, sp.y - h.y) > 10) { ready = false; walkTo(h, sp.x, sp.y, dt); } });
      if (ready || G.altarT > 8) { G.altarState = 'pray'; G.altarT = 0; L('Герои выстраиваются перед Солнечным алтарём…', 'sys'); }
    } else if (G.altarState === 'pray') {
      if (Math.random() < dt * 25) G.fx.push({ k: 'spark', x: A.x + rnd(-30, 30), y: A.y + rnd(-10, 10), vx: rnd(-20, 20), vy: rnd(-90, -40), t: 0, dur: rnd(.6, 1.1), col: '#ffe27a' });
      if (G.altarT > 3.5) { applyAltar(); G.altarState = 'done'; G.altarT = 0; }
    } else if (G.altarT > 1.3) { G.phase = 'exit'; G.exitT = 0; }
  } else if (ph === 'loot') {
    G.lootT += dt; const c = G.room.chest; let near = false;
    aliveHeroes().forEach((h, i) => { walkTo(h, c.x - 30 + (i % 3) * 22, c.y + 26 - Math.floor(i / 3) * 40, dt); if (dist(h, c) < 46) near = true; });

function drawHero(h) {
  const c = cx, r = h.r;
  c.save(); c.translate(h.x, h.y);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, r - 4, r * .9, r * .35, 0, 0, TAU); c.fill();
  if (h.healer && h.alive) {
    c.save(); c.globalCompositeOperation = 'lighter'; const gr = 78 + Math.sin(G.time * 2.2) * 6;
    const g = c.createRadialGradient(0, 0, 4, 0, 0, gr); g.addColorStop(0, 'rgba(255,238,170,.42)'); g.addColorStop(.5, 'rgba(255,214,140,.16)'); g.addColorStop(1, 'rgba(255,214,140,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, gr, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,240,190,.85)'; for (let i = 0; i < 4; i++) { const a = G.time * 1.1 + i * Math.PI / 2, rr = r + 12 + Math.sin(G.time * 3 + i) * 3; c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr * .8, 1.6, 0, TAU); c.fill(); }
    c.restore();
  }
  if (h.invulnT > 0 && h.alive) { c.save(); const pu = 0.6 + 0.4 * Math.sin(G.time * 10); c.strokeStyle = `rgba(255,233,160,${pu})`; c.lineWidth = 4; c.shadowColor = '#ffe9a0'; c.shadowBlur = 16; c.beginPath(); c.arc(0, 0, r + 8, 0, TAU); c.stroke(); c.restore(); }
  if (h.healer && h.alive && G.aug && G.aug.id === 'shall' && G.aug.charge) { c.save(); c.font = '15px sans-serif'; c.textAlign = 'center'; c.shadowColor = '#ffe9a0'; c.shadowBlur = 10 + 4 * Math.sin(G.time * 3); c.fillText('☀', 0, -r - 12 + Math.sin(G.time * 2) * 2); c.restore(); }
  if (!h.alive) c.globalAlpha = 0.35;
  if (h.slowT > 0) { c.strokeStyle = 'rgba(235,232,245,.85)'; c.lineWidth = 1.5; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * (h.r + 8), Math.sin(a) * (h.r + 8)); c.stroke(); } c.beginPath(); c.arc(0, 0, h.r + 4, 0, TAU); c.stroke(); }
  if (h.rageT > 0) { c.shadowColor = '#ff3b2a'; c.shadowBlur = 18; }
  if (h.buffs.bless > 0 && h.alive) { c.strokeStyle = 'rgba(255,226,122,.5)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r + 6 + Math.sin(G.time * 5) * 1.5, 0, TAU); c.stroke(); }
  if (h.buffs.aegis > 0 && h.alive) { c.strokeStyle = 'rgba(201,184,255,.8)'; c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.arc(0, 0, r + 9, 0, TAU); c.stroke(); c.setLineDash([]); }
  if (h.buffs.pot > 0 && h.alive) { c.strokeStyle = 'rgba(255,140,60,.85)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r + 12, 0, TAU); c.stroke(); }
  if (h.buffs.sanctuary > 0 && h.alive) { c.strokeStyle = 'rgba(255,242,168,.55)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 200 + Math.sin(G.time * 3) * 4, 0, TAU); c.stroke(); c.strokeStyle = 'rgba(255,242,168,.85)'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, r + 14, 0, TAU); c.stroke(); }
  if (h.healer && h.alive && h.rezTarget && !h.rezTarget.alive) {
    const p = Math.min(1, (h.rezT || 0) / 15);
    c.strokeStyle = 'rgba(255,226,122,.7)'; c.lineWidth = 3;
    c.beginPath(); c.arc(0, 0, r + 10, -Math.PI / 2, -Math.PI / 2 + TAU * p); c.stroke();
    c.strokeStyle = 'rgba(255,226,122,.35)'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, r + 16 + Math.sin(G.time * 5) * 2, 0, TAU); c.stroke();
  }
  if (h.key === 'raph' && h.isTank && h.alive && G.phase === 'combat') { c.strokeStyle = 'rgba(255,59,42,.45)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 95 + Math.sin(G.time * 4) * 3, 0, TAU); c.stroke(); }
  if (h.isTank && h.alive && (G.phase === 'combat' || G.phase === 'enter')) { const gr = BAL.tankGuardR + Math.sin(G.time * 2.2) * 3; c.strokeStyle = 'rgba(255,179,71,.28)'; c.lineWidth = 2; c.setLineDash([6, 5]); c.beginPath(); c.arc(0, 0, gr, 0, TAU); c.stroke(); c.setLineDash([]); }
  if (h.shield > 0) { c.strokeStyle = 'rgba(127,227,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, r + 4, 0, TAU); c.stroke(); }
  // лицо
  c.save(); c.beginPath(); c.arc(0, 0, r - 2, 0, TAU); c.clip();
  const im = IMG[h.key];
  if (im && im.complete && im.naturalWidth) c.drawImage(im, -r, -r, r * 2, r * 2); else { c.fillStyle = h.d.col; c.fill(); }
  if (h.flash > 0) { c.fillStyle = 'rgba(255,60,60,.5)'; c.fillRect(-r, -r, r * 2, r * 2); }
  if (!h.alive) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(-r, -r, r * 2, r * 2); }
  c.restore();
  c.shadowBlur = 0;
  if (h.healer) { c.lineWidth = 3.5; c.strokeStyle = h.d.col; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke(); c.lineWidth = 2.5; c.strokeStyle = h.d.ring2; c.beginPath(); c.arc(0, 0, r - 3.2, 0, TAU); c.stroke(); }
  else { c.lineWidth = 4; c.strokeStyle = h.d.col; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke(); }
  c.globalAlpha = 1;
  if (h.xbow && h.alive) { c.save(); c.rotate(h.aimA || 0); c.lineCap = 'round';
    c.strokeStyle = '#4a2c14'; c.lineWidth = 4; c.beginPath(); c.moveTo(r * .3, 0); c.lineTo(r + 15, 0); c.stroke();
    c.strokeStyle = '#1f130a'; c.lineWidth = 3; c.beginPath(); c.moveTo(r + 6, -11); c.quadraticCurveTo(r + 19, 0, r + 6, 11); c.stroke();
    c.strokeStyle = 'rgba(235,225,200,.85)'; c.lineWidth = 1; c.beginPath(); c.moveTo(r + 6, -11); c.lineTo(r + 3, 0); c.lineTo(r + 6, 11); c.stroke();
    c.fillStyle = '#d8d8e0'; c.beginPath(); c.moveTo(r + 20, 0); c.lineTo(r + 14, -2.5); c.lineTo(r + 14, 2.5); c.closePath(); c.fill(); c.restore(); }
  if (h.alive) {
    const bw = 40; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(-bw / 2, -r - 12, bw, 5);
    c.fillStyle = h.hp / h.maxHp > .5 ? '#3fbf5f' : h.hp / h.maxHp > .25 ? '#e0b030' : '#e0443e'; c.fillRect(-bw / 2, -r - 12, bw * clamp(h.hp / h.maxHp, 0, 1), 5);
    if (h.isTank) { c.fillStyle = '#ffb347'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText('🛡', 0, -r - 16); }
    if (h.isGuide) { c.fillStyle = '#6ea0ff'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText('🧭', h.isTank ? 14 : 0, -r - 16); }
    if (h.stun > 0) { c.fillStyle = '#ffe27a'; c.font = '12px sans-serif'; c.textAlign = 'center'; c.fillText('✦', 0, -r - 16); }
  } else { c.fillStyle = '#ddd'; c.font = 'bold 18px sans-serif'; c.textAlign = 'center'; c.fillText('✕', 0, 6); }
  c.restore();
}

function drawPrepScene(R) {
  const c = cx, P = R.prep;
  c.fillStyle = 'rgba(40,95,55,.12)';
  for (const p of P.patches) { c.beginPath(); c.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU); c.fill(); }
  c.strokeStyle = 'rgba(150,110,60,.17)'; c.lineWidth = 54; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(0, 280); c.lineTo(300, 300); c.lineTo(430, 300); c.lineTo(600, 292); c.lineTo(W, 280); c.stroke();
  c.lineCap = 'butt'; c.lineJoin = 'miter';
  for (const f of P.flowers) { c.fillStyle = f.col; c.beginPath(); c.arc(f.x, f.y, 2.6, 0, TAU); c.fill(); }
  // лежанки
  for (const b of P.beds) {
    c.save(); c.translate(b.x, b.y); c.rotate(b.a);
    c.fillStyle = '#5a4330'; c.fillRect(-27, -15, 54, 30);
    c.fillStyle = b.col; c.fillRect(-12, -12, 37, 24);
    c.fillStyle = '#e8e0cf'; c.beginPath(); c.arc(-19, 0, 8, 0, TAU); c.fill();
    c.strokeStyle = '#2a2018'; c.lineWidth = 2; c.strokeRect(-27, -15, 54, 30);
    c.restore();
  }
  // камни и брёвна у костра
  const f = P.fire;
  c.fillStyle = '#7a7a82';
  for (let i = 0; i < 9; i++) { const a = TAU * i / 9; c.beginPath(); c.arc(f.x + Math.cos(a) * 27, f.y + Math.sin(a) * 27, 4, 0, TAU); c.fill(); }
  for (const l of [[-52, 12, 0.3], [54, -6, -0.4]]) {
    c.save(); c.translate(f.x + l[0], f.y + l[1]); c.rotate(l[2]);
    c.fillStyle = '#6a4a2a'; c.fillRect(-24, -6, 48, 12); c.strokeStyle = '#2e1d0e'; c.lineWidth = 2; c.strokeRect(-24, -6, 48, 12);
    c.fillStyle = '#8a6a42'; c.beginPath(); c.arc(24, 0, 6, 0, TAU); c.fill(); c.stroke(); c.restore();
  }
  // палатки

}
function passiveText(h) {
  const S = h.S;
  if (h.healer) {
    let t = `Атаки лечат · Каменная кожа · Свет Возрождения ×${h.ult} · 50% урона берёт прикрывающий · Оглушающая волна · Святилище · Воскрешение 15с (50% HP, +25% урона на канале)`;
    if (G.aug && G.aug.id === 'stache') t += ` · Усы: блок ${Math.round((G.aug.blockChance || 0.25) * 100)}%`;
    if (h.buffs.sanctuary > 0) t += ` (Святилище ${Math.ceil(h.buffs.sanctuary)}с)`;
    if (h.rezTarget && !h.rezTarget.alive) t += ` · Воскрешает ${h.rezTarget.name} ${Math.min(15, Math.floor(h.rezT || 0))}/15с`;

  }
  let parts = [];
  if (h.isTank) parts.push('🛡 Рядом: перенаправляет 35% урона союзников себе · ' + { leo: `Контратака ${Math.round(leoCounter(h) * 100)}% (лечит 35% полученного урона) · Крит-блок до 25% · Стойкость +${((h.blockStacks || 0) * 0.3).toFixed(1)}% HP / −${((h.blockStacks || 0) * 0.2).toFixed(1)}% урона`, don: `Исцеление, щиты и усиления +50% · Разряд: HP +${(h.skillHpBonus || 0).toFixed(1)}% · Щит делится 10% с черепахами`, mike: `Притяжение врагов: ${h.pulls} (здоровье +${(h.pulls * BAL.mikePull * 100).toFixed(1)}%, входящий урон −${(mikeDR(h) * 100).toFixed(1)}%)` + (h.bro ? ` · Братья: Воля +${h.bro.will.toFixed(1)} · Броня +${h.bro.armor.toFixed(1)} · Выносливость +${h.bro.end.toFixed(1)}` : ''), raph: `Вампиризм ${(raphVamp(h) * 100).toFixed(1)}% · HP +${(0.5 * (S.str || 0)).toFixed(1)}% от СИЛ · Кровавый огонь` }[h.key]);
  if (h.isBuddy) parts.push('🛡 Принимает 50% урона Аллесандра · ' + { leo: 'Аура (кроме танка): +20% скорость, атака и крит', don: 'Бьёт сразу двух врагов', mike: 'Привал: все получают уровень', raph: 'Метка на атакующего Аллесандра: −50% урон по целителю, +100% урон Рафа по нему' }[h.key]);
  if (h.isGuide) parts.push({ leo: 'Метка: удары по помеченным лечат 5% и дают щит 3% от макс. HP Лео', don: `Усиление урона и брони черепах +${3 * (G.donStacks || 0)}% (каждые 5 комнат)`, mike: 'Удары снижают броню врага на 4% (до −80%) и урон на 4% (до −32%)', raph: 'Урон +100% по врагам с HP >50%' }[h.key]);
  if (h.xbow) parts.push('🏹 Многозарядный арбалет: болты пробивают врагов, крит вызывает кровотечение (до 3 стаков), кайтит со скоростью 70%');
  return parts.join(' · ') || '';
}
function setBar(b, v, max, label) { b.firstChild.style.width = (clamp(v / max, 0, 1) * 100) + '%'; if (b.children[1]) b.children[1].textContent = label; }
let uiT = 0;
let augKey = '', augRefs = {};
function renderAug() {
  const pickEl = document.getElementById('augpick'), list = document.getElementById('augs'); if (!pickEl || !list || !G) return;
  const key = G.phase === 'pick' ? 'pick' + (G.augChoices || '') : G.aug ? G.aug.id + (G.aug.pair || '') : 'none';
  if (key !== augKey) {
    augKey = key; augRefs = {}; pickEl.innerHTML = ''; list.innerHTML = '';
    const mk = (a, cls) => { const d = document.createElement('div'); d.className = 'augcard r-' + a.rarity + ' ' + cls; const stacheIc = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><circle cx="32" cy="32" r="30" fill="#FFD54A"/><rect x="10" y="24" width="18" height="14" rx="3" fill="none" stroke="#333" stroke-width="2.5"/><rect x="36" y="24" width="18" height="14" rx="3" fill="none" stroke="#333" stroke-width="2.5"/><line x1="28" y1="30" x2="36" y2="30" stroke="#333" stroke-width="2.5"/><ellipse cx="32" cy="40" rx="3" ry="4" fill="#E8A838"/><path d="M18 46 Q25 52 32 46 Q39 52 46 46 Q40 54 32 52 Q24 54 18 46Z" fill="#5A3A1A"/><path d="M26 54 Q32 58 38 54" fill="none" stroke="#C47A2A" stroke-width="1.5" stroke-linecap="round"/></svg>'; const icHtml = (a.id === 'stache') ? stacheIc : a.ic; d.innerHTML = `<div class="ic">${icHtml}</div><div class="nm">${a.name}</div><div class="ds">${a.desc}</div>`; return d; };
    const note = t => { const n = document.createElement('div'); n.className = 'augnote'; n.textContent = t; list.appendChild(n); };
    if (G.phase === 'pick') {
      pickEl.style.display = 'flex';
      const t = document.createElement('div'); t.className = 'ttl'; t.textContent = 'Выберите карту на этот забег'; pickEl.appendChild(t);
      const row = document.createElement('div'); row.className = 'row'; pickEl.appendChild(row);
      for (const id of (G.augChoices || Object.keys(AUG))) { const d = mk(AUG[id], 'pick'); d.onclick = () => chooseAug(id); row.appendChild(d); }
      note('Выбор карты — на игровом экране.');
    } else {
      pickEl.style.display = 'none';
      if (G.aug) { const d = mk(AUG[G.aug.id], 'on'); const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'активна'; d.appendChild(b);
        const st = document.createElement('div'); st.className = 'st'; d.appendChild(st); augRefs.st = st; list.appendChild(d); }
      else note('Здесь появятся выбранные аугментации. Карту нужно выбрать после подготовительной комнаты — сразу после «Начать забег».');
    }
  }
  if (augRefs.st && G.aug) {
    const A = G.aug;
    const fmt = n => Math.round(n).toLocaleString(LANG === 'en' ? 'en-US' : 'ru-RU');
    if (A.id === 'storm') {
      const st = (G.phase === 'combat' && G.enemies.length) ? `⚡ Следующая молния через ${Math.max(0, A.t).toFixed(1)} с` : 'Буря затаилась до следующего боя';
      augRefs.st.innerHTML = `Урон бури: <b>${fmt(A.stormDmg || 0)}</b><br>${st}`;
    } else if (A.id === 'shall') {
      const st = A.charge ? '☀ Заряд Рассвета: <b>готов</b>' : `Заряд израсходован · привалов до восстановления: ${AUG_BAL.dawnRests - A.rests} (или Солнечный алтарь)`;
      augRefs.st.innerHTML = `Спасений: <b>${A.saves || 0}</b><br>${st}`;
    } else if (A.id === 'nerd') {
      const n = G.drones.filter(d => d.alive).length;
      const st = `Дронов: <b>${n}/${AUG_BAL.droneN}</b>` + (n < AUG_BAL.droneN ? ' · новый — на привале' : '');
      augRefs.st.innerHTML = `Урон дронов: <b>${fmt(A.droneDmg || 0)}</b><br>${st}`;
    } else if (A.id === 'cowa') {
      const bars = cowaTurtles().map(h => { const v = Math.min(1, A.meter[h.key] || 0); return `<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span style="width:84px;color:${h.d.col}">${h.name}</span><span style="flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(v * 100)}%;background:${v >= 1 ? '#ffd24a' : h.d.col}"></i></span><span style="width:34px;text-align:right">${Math.round(v * 100)}%</span></div>`; }).join('');
      const st = A.cb ? '🐢 COWABUNGA! Время остановлено!' : A.ready ? '⚡ <b>Шкалы полны</b> — рывок в следующей боевой комнате' : 'Шкалы растут после каждой боевой комнаты';
      augRefs.st.innerHTML = `Супер-атак: <b>${A.supers || 0}</b> · урон: <b>${fmt(A.superDmg || 0)}</b><br>${bars}${st}`;
    } else if (A.id === 'stache') {
      const ch = Math.round((A.blockChance || 0.25) * 100);
      augRefs.st.innerHTML = `Шанс блока: <b>${ch}%</b><br>Блоков: <b>${A.blocks || 0}</b> · заблокировано: <b>${fmt(A.blocked || 0)}</b>`;
    } else if (A.id === 'xbow') {

      augRefs.st.innerHTML = (mk ? `Заряды: <b>${mk.xbReload > 0 ? 'перезарядка' : (mk.xbAmmo || 0) + '/' + XB.mag}</b>` : '') + `<br>Урон от кровотечения: <b>${fmt(A.bleedDmg || 0)}</b>`;
    } else {
      const pr = comboPair(); const nm = pr ? pr.map(h => `<span style="color:${h.d.col}">${h.name}</span>`).join(' ⇄ ') : '';
      const on = pr && pr[0].alive && pr[1].alive;

}
function updateUI() {
  renderAug();
  for (const h of G.heroes) {
    const r = cardRefs[h.key], S = h.S;
    r.el.classList.toggle('dead', !h.alive);
    r.lv.textContent = ' ур.' + h.level;
    r.tag.textContent = [h.isTank ? '🛡 ТАНК' : '', h.isBuddy ? '🤝 телохранитель' : '', h.isGuide ? '🧭 направляющий' : '', h.healer ? '✚ целитель' : ''].filter(Boolean).join(' · ');
    setBar(r.hp, h.hp, h.maxHp, `Здоровье ${Math.ceil(h.hp)}/${h.maxHp}${h.shield > 0 ? ' +' + Math.round(h.shield) : ''}`);
    setBar(r.res, h.res, h.maxRes, `${h.healer ? 'Мана' : 'Энергия'} ${Math.floor(h.res)}/${h.maxRes}`);
    if (r.rage) setBar(r.rage, h.rage, 100, `Ярость ${Math.round(h.rage)}${h.rageT > 0 ? ' 🔥' : ''}`);
    setBar(r.xp, h.xp, h.xpNext, '');
    const st = [['СИЛ', S.str], ['ЛОВ', S.agi], ['ВЫН', S.end], ['СКР', S.spd], ['ВОЛ', S.will], ['АТК', S.atk], ['БРН', S.armorFlat], ['КРИТ', S.ce]];
    if (h.healer) st.push(['ИСЦ', S.heal], ['МАГ', S.magic]);
    r.pas.textContent = [passiveText(h), altarText(h)].filter(Boolean).join(' · ');
    r.stats.innerHTML = st.map(s => `<span>${s[0]} <b>${Math.round(s[1])}</b></span>`).join('');
    r.gear.innerHTML = SLOTS.map(sl => { const it = h.gear[sl]; return `<i title="${it ? itemStr(it) : SLOT_RU[sl] + ': пусто'}" style="border-color:${it ? RARITY[it.rar].c : '#333'};background:${it ? RARITY[it.rar].c + '33' : 'transparent'}">${{weapon:'Ор',armor:'Бр',amulet:'Ам',boots:'Об'}[sl]}</i>`; }).join('');
  }
  document.getElementById('meta').textContent = `Забег №${G.run} · убито ${G.kills} · находок ${G.itemsFound} · ◈ ${G.coins} · зелья ${G.potHeal}/${G.potBuff} · возрождений ${G.coinsUsed} · рекорд ${BEST}`;

onLog = (t, c) => { const d = document.createElement('div'); d.className = 'l ' + c; d.textContent = t; logEl.appendChild(d); while (logEl.children.length > 70) logEl.removeChild(logEl.firstChild); logEl.scrollTop = logEl.scrollHeight; };

// ---------- управление ----------
const startBtn = document.getElementById('startrun'), stageEl = document.querySelector('.stage'), wideBtn = document.getElementById('wide');
startBtn.onclick = () => { startRunFromPrep(); startBtn.style.display = 'none'; };
function fitCanvas() {
  if (document.body.classList.contains('wide')) { const w = Math.min(stageEl.clientWidth, (window.innerHeight - 150) * W / H); cv.style.width = Math.max(300, w) + 'px'; cv.style.margin = '0 auto'; }
  else { cv.style.width = ''; cv.style.margin = ''; }
}
wideBtn.onclick = () => { const on = document.body.classList.toggle('wide'); wideBtn.textContent = on ? '⤡ Свернуть' : '⤢ Расширить'; wideBtn.classList.toggle('on', on); fitCanvas(); };
window.addEventListener('resize', fitCanvas);
function setSpeed(s) { G.speed = s; window.__speed = s; document.querySelectorAll('[data-sp]').forEach(b => b.classList.toggle('on', +b.dataset.sp === s)); }
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => setSpeed(+b.dataset.sp));
document.getElementById('pause').onclick = () => { G.paused = !G.paused; document.getElementById('pause').classList.toggle('on', G.paused); };
document.getElementById('newrun').onclick = () => { logEl.innerHTML = ''; newRun(); document.getElementById('pause').classList.remove('on'); buildCards(); setSpeed(window.__speed || 1); };

function fmtStat(n) { return Math.round(n).toLocaleString(LANG === 'en' ? 'en-US' : 'ru-RU'); }
function shieldStat(h) {
  // У Аллесандра — сила наложенных щитов; у остальных — урон, заблокированный щитами
  return (h.healer ? (h.shieldGiven || 0) : (h.shieldAbs || 0));
}
function dpsOf(dmg, t) { return t > 0.5 ? fmtStat(dmg / t) : '0'; }
function heroStatRow(h, t) {
  const tag = (h.isTank ? ' 🛡' : '') + (h.isBuddy ? ' 🤝' : '') + (h.isGuide ? ' 🧭' : '');
  const healAll = (h.healDone || 0) + (h.selfHeal || 0);
  return `<tr>
    <td class="name" style="color:${h.col || (h.d && h.d.col) || '#ccc'}">${h.name}${tag}</td>
    <td>${fmtStat(h.dmgDone)}</td>
    <td>${dpsOf(h.dmgDone, t)}</td>
    <td>${fmtStat(h.dmgTaken)}</td>
    <td>${fmtStat(healAll)}</td>
    <td>${fmtStat(shieldStat(h))}</td>
    <td>${h.kills}</td>
  </tr>`;
}
function sumHeroes(list) {
  return list.reduce((a, h) => {
    a.dmgDone += h.dmgDone || 0; a.dmgTaken += h.dmgTaken || 0;
    a.healAll += (h.healDone || 0) + (h.selfHeal || 0);
    a.shieldBlock += shieldStat(h); a.kills += h.kills || 0;
    return a;
  }, { dmgDone: 0, dmgTaken: 0, healAll: 0, shieldBlock: 0, kills: 0 });
}
function renderStatsBar() {
  const live = document.getElementById('statsLive');
  const prev = document.getElementById('statsPrev');
  if (!G || !G.heroes) { live.innerHTML = ''; return; }
  const rows = G.heroes.map(h => heroStatRow(h, G.fightT)).join('');
  const tot = sumHeroes(G.heroes);
  live.innerHTML = `<table>
    <thead><tr>
      <th>Герой</th><th title="Урон">Урон</th><th title="Урон в секунду: урон / время в боях">УВС</th><th title="Получено">Получ.</th><th title="Исцеление (включая самоисцеление)">Исцел.</th><th title="Аллесандр: сила наложенных щитов · остальные: урон, заблокированный щитами">Щит</th><th title="Убито">Убит.</th>
    </tr></thead>
    <tbody>${rows}
    <tr class="tot"><td>Итого</td><td>${fmtStat(tot.dmgDone)}</td><td>${dpsOf(tot.dmgDone, G.fightT)}</td><td>${fmtStat(tot.dmgTaken)}</td><td>${fmtStat(tot.healAll)}</td><td>${fmtStat(tot.shieldBlock)}</td><td>${tot.kills}</td></tr>
    </tbody></table>`;
  if (LAST_STATS) {
    const t = sumHeroes(LAST_STATS.heroes);
    const topDmg = LAST_STATS.heroes.slice().sort((a, b) => b.dmgDone - a.dmgDone)[0];
    prev.style.display = 'block';
    prev.innerHTML = `<b>Прошлый забег №${LAST_STATS.run}</b> · до комнаты ${LAST_STATS.n} · убито ${LAST_STATS.kills} · находок ${LAST_STATS.itemsFound}`
      + ` · урон ${fmtStat(t.dmgDone)} · УВС ${dpsOf(t.dmgDone, LAST_STATS.fightT)} · получено ${fmtStat(t.dmgTaken)} · исцеление ${fmtStat(t.healAll)}`
      + ` · щит ${fmtStat(t.shieldBlock)} · лучший урон: <span style="color:${topDmg.col}">${topDmg.name}</span> (${fmtStat(topDmg.dmgDone)})`;
  } else {
    prev.style.display = 'none';
    prev.innerHTML = '';
  }
}

let last = performance.now(), acc = 0, runSeen = 0;
function frame(ts) {
  const real = Math.min(0.1, (ts - last) / 1000); last = ts;
  if (G.run !== runSeen) { runSeen = G.run; buildCards(); if (G.run > 1) logEl.innerHTML = ''; }
  if (!G.paused) { let sim = real * G.speed; while (sim > 0) { const step = Math.min(sim, 1 / 30); update(step); sim -= step; } }
  draw(); startBtn.style.display = G.phase === 'prep' ? 'block' : 'none'; uiT += real; if (uiT > 0.12) { uiT = 0; updateUI(); }
  requestAnimationFrame(frame);
}
window.__speed = 1;
newRun(); buildCards(); runSeen = G.run; setSpeed(1); i18nInit();
requestAnimationFrame(frame);

</script>
